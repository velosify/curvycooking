<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-label="Curvy Cooking">
  <defs>
    <linearGradient id="cc-chili-fill" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"  stop-color="#ff6b5e"/>
      <stop offset="55%" stop-color="#ef3b3b"/>
      <stop offset="100%" stop-color="#a8121a"/>
    </linearGradient>
    <linearGradient id="cc-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7eb04b"/>
      <stop offset="100%" stop-color="#4d7c2b"/>
    </linearGradient>
  </defs>

  <!-- Chili pepper mark -->
  <g transform="translate(2, 2)">
    <!-- Stem (small curled leaf) -->
    <path d="M 22 11
             C 24 4, 30 1, 36 5
             C 34 9, 30 12, 26 13
             C 24 13, 22 12, 22 11 Z"
          fill="url(#cc-stem)"/>
    <!-- Body (tapered teardrop, leans slightly) -->
    <path d="M 23 12
             C 32 12, 40 18, 42 28
             C 44 38, 41 47, 35 53
             C 31 56, 26 58, 22 59
             L 16 62
             L 18 55
             C 13 49, 10 40, 12 30
             C 14 19, 17 13, 23 12 Z"
          fill="url(#cc-chili-fill)"/>
    <!-- Highlight (subtle gloss on left shoulder) -->
    <path d="M 22 19
             C 25 19, 27 22, 27 26
             C 27 28, 25 28, 23 27
             C 21 24, 20 21, 22 19 Z"
          fill="rgba(255,255,255,0.28)"/>
  </g>

  <!-- Wordmark -->
  <g fill="#f5ecdb">
    <!-- "Curvy" in italic Playfair Display serif -->
    <text x="62" y="44"
          font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
          font-style="italic"
          font-weight="600"
          font-size="36"
          letter-spacing="-0.5">Curvy</text>
    <!-- "Cooking" in upright Helvetica/Inter bold sans -->
    <text x="166" y="44"
          font-family="'Helvetica Neue', 'Inter', Helvetica, Arial, sans-serif"
          font-weight="800"
          font-size="34"
          letter-spacing="-1">Cooking</text>
  </g>
</svg>
